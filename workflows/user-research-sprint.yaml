workflow_id: user_research_sprint
name: 用户研究冲刺
description: 将真实用户研究材料整理成主场景决策输入, 不编造访谈或市场数据。
risk_default: medium
trigger:
  source: manual
  accepted_inputs:
    - interview_notes
    - founder_notes
    - github_doc
agents:
  primary: Product Manager Agent
  reviewers:
    - Customer Success Agent
    - Compliance Agent
  archive: Knowledge Ops Agent
context_paths:
  - docs/research/interview-record-template.md
  - docs/research/pain-scorecard.md
  - docs/research/pilot-interest-board.md
  - docs/research/main-scenario-decision.md
  - docs/product/prd-v1.md
output_paths:
  - docs/research/interview-record-template.md
  - docs/research/pain-scorecard.md
  - docs/research/pilot-interest-board.md
  - docs/research/main-scenario-decision.md
steps:
  - id: collect_context
    agent: Product Manager Agent
    action: read_research_context
    inputs:
      - context_paths
    outputs:
      - handoff_input_package
    approval_state: draft
  - id: score_pain
    agent: Product Manager Agent
    action: update_pain_scorecard_from_verified_inputs
    inputs:
      - handoff_input_package
    outputs:
      - docs/research/pain-scorecard.md
    approval_state: draft
  - id: review_customer_evidence
    agent: Customer Success Agent
    action: review_feedback_completeness_and_customer_risk
    inputs:
      - docs/research/pain-scorecard.md
    outputs:
      - review_notes
    approval_state: reviewed
  - id: review_privacy
    agent: Compliance Agent
    action: review_sensitive_data_and_external_contact_risk
    inputs:
      - docs/research/interview-record-template.md
      - docs/research/pilot-interest-board.md
    outputs:
      - compliance_notes
    approval_state: reviewed
  - id: archive_decision_inputs
    agent: Knowledge Ops Agent
    action: record_evidence_paths_and_next_goal
    inputs:
      - review_notes
      - compliance_notes
    outputs:
      - docs/research/main-scenario-decision.md
    approval_state: archived
guardrails:
  forbidden_actions:
    - payment
    - contract_signing
    - external_send
    - privacy_policy_change
    - security_exception
    - mass_production_commitment
  high_risk_policy: founder_approval_required
  unknown_fact_policy: mark_as_uncollected_or_pending_verification
evaluation:
  eval_file: evals/agent-routing-evals.yaml
  cases:
    - user_research_requires_no_fabrication
    - external_contact_requires_founder_approval
